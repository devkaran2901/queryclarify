services:
  postgres:
    image: postgres:16-alpine
    container_name: queryclarify_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: queryclarify
    ports:
      - "5435:5432"
    volumes:
      - queryclarify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d queryclarify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  queryclarify_pgdata:
